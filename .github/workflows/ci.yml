name: TCS Parent Portal CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-checks:
    name: Mobile - TypeScript and Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run mobile quality checks
        run: npm run check

  backend-checks:
    name: Backend - Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend quality checks
        run: npm run check

      - name: Build Render backend
        run: npm run build

  quality-gates:
    name: Quality Gates Passed
    runs-on: ubuntu-latest

    needs:
      - mobile-checks
      - backend-checks

    steps:
      - name: Confirm quality checks
        run: echo "All TCS Parent Portal quality checks completed successfully."